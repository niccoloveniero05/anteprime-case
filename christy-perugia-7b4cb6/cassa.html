<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cassa · Christy Perugia</title>
<meta name="description" content="Completa il tuo ordine da Christy Perugia.">
<meta property="og:title" content="Christy Perugia">
<meta property="og:description" content="Abbigliamento uomo e donna Made in Italy · Negozio online e in Corso Vannucci 105, Perugia">
<meta property="og:image" content="https://niccoloveniero05.github.io/anteprime-case/christy-perugia-7b4cb6/img/anteprima-link.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#151310">
<link rel="icon" href="favicon.ico?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css?v=5">
</head>
<body>

<header class="testata cassa-testata">
  <div class="contenitore">
    <a class="torna" href="negozio.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg><span>Negozio</span></a>
    <a class="marchio" href="index.html" aria-label="Christy Perugia, home"><img src="img/logo-scuro.webp" alt="Christy Perugia" width="936" height="664"></a>
    <span class="cassa-sicura"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg><span class="solo-pc">Pagamento sicuro</span></span>
  </div>
</header>
<main class="contenitore">
  <div class="cassa">
    <details class="riepilogo" open>
      <summary><span class="apri">Riepilogo dell'ordine <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span><b data-tot></b></summary>
      <div class="righe-mini"></div>
      <div class="somme">
        <div><span>Subtotale</span><span data-sub></span></div>
        <div><span>Spedizione</span><span data-sped></span></div>
        <div class="tot"><span>Totale</span><span><small data-iva></small><span data-tot></span></span></div>
      </div>
    </details>
    <form class="modulo" novalidate>
      <h2>Contatti</h2>
      <div class="campi">
        <div class="campo tutta"><input id="email" name="email" type="email" placeholder=" " autocomplete="email" required><label for="email">Email</label></div>
        <div class="campo"><input id="nome" name="nome" type="text" placeholder=" " autocomplete="given-name" required><label for="nome">Nome</label></div>
        <div class="campo"><input id="cognome" name="cognome" type="text" placeholder=" " autocomplete="family-name" required><label for="cognome">Cognome</label></div>
        <div class="campo tutta"><input id="telefono" name="telefono" type="tel" placeholder=" " autocomplete="tel"><label for="telefono">Telefono</label></div>
      </div>
      <h2>Consegna</h2>
      <div class="scelte">
        <label><input type="radio" name="consegna" value="corriere" checked><span>Corriere espresso<small>2-4 giorni lavorativi</small></span><span class="dx" data-corriere></span></label>
        <label><input type="radio" name="consegna" value="ritiro"><span>Ritiro in negozio<small>Corso Vannucci 105, Perugia</small></span><span class="dx">Gratis</span></label>
      </div>
      <div class="solo-corriere">
        <h2>Indirizzo</h2>
        <div class="campi">
          <div class="campo tutta"><input id="indirizzo" name="indirizzo" type="text" placeholder=" " autocomplete="address-line1" required><label for="indirizzo">Via e numero civico</label></div>
          <div class="campo"><input id="cap" name="cap" type="text" placeholder=" " autocomplete="postal-code" required inputmode="numeric" maxlength="5"><label for="cap">CAP</label></div>
          <div class="campo"><input id="citta" name="citta" type="text" placeholder=" " autocomplete="address-level2" required><label for="citta">Città</label></div>
          <div class="campo tutta"><input id="provincia" name="provincia" type="text" placeholder=" " autocomplete="address-level1" required><label for="provincia">Provincia</label></div>
        </div>
      </div>
      <h2>Pagamento</h2>
      <div class="scelte">
        <label><input type="radio" name="pagamento" value="carta" checked><span>Carta di credito o debito</span><span class="marchi-pag"><i>VISA</i><i>MC</i><i>AMEX</i></span></label>
        <label><input type="radio" name="pagamento" value="paypal"><span>PayPal</span></label>
        <label><input type="radio" name="pagamento" value="apple"><span>Apple Pay</span></label>
        <label><input type="radio" name="pagamento" value="satispay"><span>Satispay</span></label>
      </div>
      <p class="nota-prova">Anteprima dimostrativa: il pagamento non è attivo e nessun dato viene inviato.</p>
      <button class="btn btn-pieno paga" type="submit">Paga <span data-tot></span></button>
      <p class="legale">Confermando accetti le condizioni di vendita e l'informativa privacy.</p>
    </form>
  </div>
</main>
<section class="contenitore grazie" hidden>
  <div class="spunta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
  <h1>Grazie, <em data-nome></em></h1>
  <p data-cosa></p>
  <p class="numero" data-num></p>
  <div><a class="btn btn-pieno" href="index.html">Torna alla home</a></div>
</section>

<script src="dati.js?v=5"></script>
<script src="negozio.js?v=5"></script>
</body>
</html>
