<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prova · Creazione Contenuti r1</title>
<style>
/* Prototipo a sé (21/11): la scena di «Creazione Contenuti» per la sezione Servizi della home, al telefono.
   Dalla bozza al reel finito sul profilo del Jué. Tutto con «cc-». Animazioni solo transform, opacity, clip-path
   (Web Animations API, una sola linea del tempo di 12 s che si ripete). */
@font-face{font-family:'Inter';src:url(fonts/inter.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'News';src:url(fonts/Newsreader-italic.woff2) format('woff2');font-weight:200 800;font-style:italic;font-display:swap}
@font-face{font-family:'Geist Mono';src:url(fonts/GeistMono-400.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
:root{--bg:#100F09;--av:#F5F4EF;--av2:rgba(245,244,239,.62);--rec:#FF5A1F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--av)}
body{font:400 17px/1.55 'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:24px}
.colonna{width:100%;max-width:560px;margin:0 auto}

/* il riquadro dei Servizi (.m della home): 4:5, scuro, il filo di 1 px */
.cc{position:relative;aspect-ratio:4/5;margin:0 -8px;border-radius:14px;overflow:hidden;isolation:isolate;container-type:inline-size;
  background:linear-gradient(180deg,#1A1912 0%,#13120C 60%);box-shadow:inset 0 0 0 1px rgba(245,244,239,.085);display:flex;flex-direction:column}
.cc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:9;box-shadow:inset 0 0 0 1px rgba(245,244,239,.09)}
.cc p{margin:0}
.cc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 1 · la frase in alto, come «Completamente personalizzabile●» del Sito Web */
.cc-testa{flex:none;padding:20px 20px 0;position:relative;z-index:2}
.cc-battute{display:grid}
.cc-battuta{grid-area:1/1;font-weight:560;font-size:clamp(22px,7.3cqi,30px);line-height:1.08;letter-spacing:-.036em;color:var(--av2)}
.cc-battuta em{font-style:normal;font-weight:600;color:var(--av);letter-spacing:-.03em}
.cc-battuta + .cc-battuta{opacity:0}
.cc-pt{display:inline-block;width:.19em;height:.19em;border-radius:50%;background:var(--rec);margin-left:.05em}

/* 2 · la scena: un palco di 340 × 360 px rimpicciolito o ingrandito dallo script, appoggiato in basso */
.cc-scena{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.cc-palco{position:absolute;left:0;top:0;width:340px;height:360px;transform-origin:0 0}
.cc-giro{position:absolute;inset:0}
.cc-palco *{position:absolute}
.cc-palco img,.cc-palco video{display:block;max-width:none}

/* etichetta di lavorazione (01 · Bozza …) */
.cc-tag{left:85.6px;top:12px;font:400 8.5px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--av2);white-space:nowrap;opacity:0}
.cc-tag b{position:static;font-weight:400;color:var(--rec)}

/* la bozza: cinque gruppi di tratti, ognuno nel suo strato (si scopre con clip-path) */
.cc-bozza{left:85.625px;top:34px;width:168.75px;height:300px}
.cc-bozza > div{inset:0}
.cc-bozza svg{inset:0;width:100%;height:100%;overflow:visible;fill:none;stroke:rgba(245,244,239,.8);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.cc-bozza .fine{stroke:rgba(245,244,239,.34);stroke-width:.9}
.cc-bozza .ar{stroke:var(--rec)}
.cc-bozza > .cc-note{inset:auto;left:178px;top:0;height:300px;width:80px;font:400 7px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:rgba(245,244,239,.5)}
.cc-note span{position:absolute;left:0;white-space:nowrap}
.cc-note span::before{content:"";position:absolute;right:calc(100% + 4px);top:3px;width:12px;border-top:1px solid rgba(245,244,239,.3)}

/* i pezzi grezzi e il reel */
.cc-pezzo{left:10px;top:94px;width:320px;height:180px;border-radius:5px;overflow:hidden;opacity:0;background:#2a2a28}
.cc-pezzo img{inset:0;width:100%;height:100%;object-fit:cover}
.cc-taglio{top:150px;width:2px;height:68px;margin-left:-1px;border-radius:1px;background:var(--rec);opacity:0}
.cc-reel{left:85.625px;top:34px;width:168.75px;height:300px;transform-origin:50% 50%;opacity:0;
  clip-path:inset(0 -108.33% 0 -108.33% round 9px)}
.cc-grezzo{left:-108.33%;top:0;width:316.66%;height:100%;object-fit:cover}
.cc-finito{inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(0 100% 0 0)}
.cc-riga{left:0;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--rec);box-shadow:0 0 10px rgba(255,90,31,.8);opacity:0}
.cc-ombra{left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(16,15,9,0) 0%,rgba(16,15,9,.72) 100%);opacity:0}
.cc-titolo{left:14px;right:12px;bottom:30px;font-weight:650;font-size:23px;line-height:1.02;letter-spacing:-.035em;color:#fff}
.cc-titolo > span{position:relative;display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.cc-titolo > span > span{position:relative;display:block;transform:translateY(110%)}
.cc-titolo em{position:relative;font-family:'News',Georgia,serif;font-style:italic;font-weight:400;font-size:1.12em;letter-spacing:-.01em}
.cc-titolo i{position:relative;display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--rec);margin-left:.04em;transform:scale(0)}
.cc-avanza{left:10px;right:10px;top:9px;height:2px;border-radius:1px;background:rgba(255,255,255,.28);overflow:hidden;opacity:0}
.cc-avanza i{inset:0;background:#fff;transform-origin:0 50%;transform:scaleX(0)}

/* il telefono con il profilo del Jué (colori del tema, niente blu di Instagram) */
.cc-tel{left:70px;top:6px;width:200px;height:400px;border-radius:30px;background:#0A0906;opacity:0;transform-origin:50% 62%;
  box-shadow:inset 0 0 0 1px rgba(245,244,239,.16),0 0 0 4px #0D0C08,0 0 0 5px rgba(245,244,239,.07),0 30px 60px -24px rgba(0,0,0,.9)}
.cc-schermo{inset:5px;border-radius:25px;overflow:hidden;background:#0B0A07;font-family:'Inter',sans-serif;color:var(--av)}
.cc-schermo *{position:relative}
.cc-schermo .cc-isola{position:absolute;top:4px;left:50%;width:52px;height:13px;margin-left:-26px;border-radius:99px;background:#000}
.cc-stato{display:flex;align-items:center;justify-content:space-between;height:18px;padding:3px 15px 0 20px;font:600 7.5px/1 'Inter',sans-serif}
.cc-stato > span{display:flex;gap:3px;align-items:center}
.cc-stato i{display:block;width:9px;height:5px;border-radius:1px;background:var(--av)}
.cc-stato i + i{width:7px}
.cc-stato i + i + i{width:12px;border-radius:2px}
.cc-barra{display:flex;align-items:center;height:20px;padding:0 10px;gap:3px;font:700 8.5px/1 'Inter',sans-serif;letter-spacing:-.01em}
.cc-barra svg{width:8px;height:8px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cc-barra .cc-dx{margin-left:auto;display:flex;gap:9px}
.cc-barra .cc-dx svg{width:10px;height:10px;stroke-width:1.8}
.cc-prof{display:flex;align-items:center;gap:12px;padding:4px 10px 0}
.cc-av{flex:none;width:46px;height:46px;border-radius:50%;background:#000 url(media/jue-logo.png) 50% 54%/66% auto no-repeat;box-shadow:0 0 0 2px #0B0A07,0 0 0 3px rgba(245,244,239,.3)}
.cc-num{flex:1;display:flex;justify-content:space-between;text-align:center;padding-right:4px}
.cc-num > span{display:block;font-size:6.5px;line-height:1.3;color:var(--av2)}
.cc-num b{display:block;font-size:9px;line-height:1.15;font-weight:700;color:var(--av)}
.cc-post{display:block;height:10.35px;overflow:hidden}
.cc-post-in{display:block}
.cc-post b{display:block}
.cc-bio{padding:7px 10px 0;font-size:6.8px;line-height:1.38;color:var(--av2)}
.cc-bio b{display:block;color:var(--av);font-weight:600;font-size:7.2px}
.cc-btn{display:flex;gap:3px;padding:6px 10px 0}
.cc-btn span{flex:1;height:16px;border-radius:5px;background:#24231D;font:600 6.8px/16px 'Inter',sans-serif;text-align:center}
.cc-schede{display:flex;margin-top:8px;border-bottom:1px solid rgba(245,244,239,.1)}
.cc-schede span{flex:1;height:19px;display:grid;place-content:center;color:rgba(245,244,239,.42)}
.cc-schede span:first-child{color:var(--av);box-shadow:inset 0 -1px 0 var(--av)}
.cc-schede svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cc-griglia{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:1px}
.cc-griglia > i{display:block;aspect-ratio:3/4;background:#25241E}
.cc-griglia > i:nth-child(2n){background:#2B2A23}
.cc-griglia > i:nth-child(3n+1){background:#211F19}
.cc-griglia > i.r::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:1.5px;box-shadow:inset 0 0 0 1px rgba(245,244,239,.28)}
.cc-griglia > i.vuoto{background:transparent}
.cc-vuoto-filo{position:absolute;inset:0;border-radius:2px;border:1px dashed rgba(245,244,239,.26)}
.cc-vuoto-filo::after{content:"+";position:absolute;left:0;right:0;top:50%;margin-top:-6px;text-align:center;font:300 12px/12px 'Inter',sans-serif;color:rgba(245,244,239,.3)}
.cc-mira{position:absolute;inset:-1px;border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--rec);opacity:0}
.cc-fondo{left:-20px;right:-20px;bottom:-1px;height:40px;background:linear-gradient(180deg,rgba(19,18,12,0),#13120C 85%);opacity:0}
/* il lampo arancio quando il reel entra nel quadrato (posizione messa dallo script) */
.cc-anello{border-radius:3px;box-shadow:0 0 0 1.5px var(--rec);opacity:0}

@media (prefers-reduced-motion:reduce){.cc *{transition:none!important}}
</style>
</head>
<body>

<script>
(function () {
  'use strict';
  var L = 12;                         // durata del giro, in secondi
  var FERMO = 10.8;                   // il fotogramma per «Riduci movimento»
  var PLAY = 6.85;                    // quando il video finito parte
  var $ = function (id) { return document.getElementById(id); };
  var cc = $('cc'), scena = $('cc-scena'), palco = $('cc-palco'), video = $('cc-video');
  if (!cc.animate) return;            // senza Web Animations resta la bozza ferma

  // ── il palco 340 × 360 si adatta alla scena, appoggiato in basso e centrato ──
  function adatta() {
    var w = scena.clientWidth, h = scena.clientHeight, k = Math.min(w / 340, h / 360);
    palco.style.transform = 'translate(' + ((w - 340 * k) / 2).toFixed(2) + 'px,' + (h - 360 * k).toFixed(2) + 'px) scale(' + k.toFixed(4) + ')';
  }
  adatta();
  if (window.ResizeObserver) new ResizeObserver(adatta).observe(scena); else addEventListener('resize', adatta);

  // ── le curve ──
  var FUORI = 'cubic-bezier(.22,.61,.36,1)', MORBIDA = 'cubic-bezier(.65,0,.35,1)', ARRIVO = 'cubic-bezier(.2,.75,.2,1)', LIN = 'linear';

  // una traccia: [[secondo, valore, curva verso il prossimo], ...] su UNA proprietà, lunga quanto il giro
  var giri = [];
  function T(el, prop, tappe) {
    if (typeof el === 'string') el = $(el);
    var kf = [], i, s;
    if (tappe[0][0] > 0) { s = {}; s[prop] = tappe[0][1]; s.offset = 0; kf.push(s); }
    for (i = 0; i < tappe.length; i++) {
      s = {}; s[prop] = tappe[i][1]; s.offset = Math.min(1, tappe[i][0] / L); s.easing = tappe[i][2] || 'linear'; kf.push(s);
    }
    if (tappe[tappe.length - 1][0] < L) { s = {}; s[prop] = tappe[tappe.length - 1][1]; s.offset = 1; kf.push(s); }
    var a = el.animate(kf, { duration: L * 1000, iterations: Infinity, fill: 'both' });
    a.pause(); giri.push(a); return a;
  }
  function tr(x, y, s, r) { return 'translate(' + x + 'px,' + y + 'px) rotate(' + (r || 0) + 'deg) scale(' + s + ')'; }

  // ── posizioni del reel (centro del 9:16 grande = 170, 184 nel palco; 168,75 × 300) ──
  var CX = 170, CY = 184, RW = 168.75, LARGO = 534.4;   // larghezza del 16:9 a piena altezza
  function reel(cx, cy, k, r) { return tr(+(cx - CX).toFixed(2), +(cy - CY).toFixed(2), +k.toFixed(4), r); }
  // il quadrato vuoto, misurato nel palco (offset: non risente delle trasformazioni)
  function dentro(el) { var x = 0, y = 0; while (el && el !== palco) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return { x: x, y: y }; }
  var cella = $('cc-cella'), p = dentro(cella), cw = cella.offsetWidth, ch = cella.offsetHeight;
  var ccx = p.x + cw / 2, ccy = p.y + ch / 2, kc = cw / RW;                          // il reel ritagliato 3:4 copre la cella
  var an = $('cc-anello'); an.style.left = p.x + 'px'; an.style.top = p.y + 'px'; an.style.width = cw + 'px'; an.style.height = ch + 'px';

  var kS = 144 / LARGO, kR = 104 / LARGO, kW = 320 / LARGO;   // sparsi, in fila, largo
  var INS_L = 'inset(0% -108.33% 0% -108.33% round 9px)', INS_V = 'inset(0% 0% 0% 0% round 9px)', INS_Q = 'inset(12.5% 0% 12.5% 0% round 6px)';

  // ── 0 · tutto il palco: entra e alla fine sfuma ──
  T('cc-giro', 'opacity', [[0, 0, FUORI], [.25, 1], [11.45, 1, MORBIDA], [11.95, 0]]);

  // ── la frase ──
  T('cc-f1', 'opacity', [[0, 1], [7.95, 1, FUORI], [8.3, 0], [11.55, 0, FUORI], [11.95, 1]]);
  T('cc-f1', 'transform', [[0, 'translateY(0px)'], [7.95, 'translateY(0px)', FUORI], [8.35, 'translateY(-8px)'], [11.5, 'translateY(10px)', FUORI], [11.95, 'translateY(0px)']]);
  T('cc-f2', 'opacity', [[0, 0], [8.1, 0, FUORI], [8.5, 1], [11.4, 1, FUORI], [11.7, 0]]);

  // ── le etichette ──
  function tag(id, a, b) {

  ['cc-b-bicchiere', 'cc-b-ghiaccio', 'cc-b-versa', 'cc-b-testo'].forEach(function (id) {

  // la cornice resta come guida del 9:16, poi il reel la riempie
  T('cc-b-cornice', 'opacity', [[2.35, 1, MORBIDA], [2.7, .45], [5.45, .45, MORBIDA], [5.9, 0]]);

  // ── 2 · le riprese: tre pezzi grezzi, storti, cadono sparsi; poi si mettono in fila ──

  T('cc-t1', 'opacity', [[3.75, 0, FUORI], [3.9, 1], [4.1, 1, FUORI], [4.25, 0]]);
  T('cc-t2', 'opacity', [[3.8, 0, FUORI], [3.95, 1], [4.1, 1, FUORI], [4.25, 0]]);
  T('cc-t1', 'transform', [[3.75, 'scaleY(.2)', ARRIVO], [3.95, 'scaleY(1)']]);
  T('cc-t2', 'transform', [[3.8, 'scaleY(.2)', ARRIVO], [4.0, 'scaleY(1)']]);

  // ── 3 · il montaggio: il pezzo centrale si allarga, si taglia in verticale, riempie la cornice ──
  T('cc-reel', 'opacity', [[2.57, 0, FUORI], [2.92, 1]]);
  T('cc-reel', 'transform', [
    [2.57, reel(234, 186 + 26, kS * .9, 8), ARRIVO], [3.17, reel(234, 186, kS, 5)],
    [3.25, reel(234, 186, kS, 5), MORBIDA], [3.85, reel(170, 184, kR, 0)],
    [4.15, reel(170, 184, kR, 0), MORBIDA], [4.75, reel(170, 184, kW, 0)],
    [5.4, reel(170, 184, kW, 0), MORBIDA], [6.0, reel(170, 184, 1, 0)],
    [8.0, reel(170, 184, 1, 0), MORBIDA], [8.95, reel(ccx, ccy - 16, kc * 1.2, 0)],
    [9.2, reel(ccx, ccy - 16, kc * 1.2, 0), 'cubic-bezier(.5,0,.75,0)'], [9.52, reel(ccx, ccy, kc * .965, 0), FUORI],
    [9.72, reel(ccx, ccy, kc, 0)]

  // ── il video finito: parte dopo il colore, si riavvolge a ogni giro ──
  var caricato = false;
  function carica() { if (!caricato) { caricato = true; video.src = video.getAttribute('data-src'); video.preload = 'auto'; video.load(); } }
  var rif = giri[0], gira = false, prima = 0, raf = 0;
  function ora() { return ((rif.currentTime || 0) / 1000) % L; }
  function passo() {
    var t = ora();
    if (t < prima) { video.pause(); try { video.currentTime = 0; } catch (e) {} }
    if (t >= PLAY && prima < PLAY) { var pr = video.play(); if (pr && pr.catch) pr.catch(function () {}); }
    prima = t;
    if (gira) raf = requestAnimationFrame(passo);
  }
  function parti() {
    if (gira) return; gira = true; carica();
    giri.forEach(function (a) { a.currentTime = 0; a.play(); });
    video.pause(); try { video.currentTime = 0; } catch (e) {}
    prima = 0; raf = requestAnimationFrame(passo);
  }
  function ferma() {
    if (!gira) return; gira = false; cancelAnimationFrame(raf);
    giri.forEach(function (a) { a.pause(); }); video.pause();
  }

  }

  var visibile = false;
  function decidi() {
    if (riduci.matches) { fermoFinale(); return; }

  }
  if (riduci.addEventListener) riduci.addEventListener('change', decidi);
  document.addEventListener('visibilitychange', decidi);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (v) { visibile = v[0].isIntersecting; decidi(); }, { threshold: .4 }).observe(cc);
  } else { visibile = true; decidi(); }
  if (riduci.matches) fermoFinale();

  // per le prove: ?t=8.5 mostra quel secondo fermo
  var q = /[?&]t=([\d.]+)/.exec(location.search);
  if (q) { riduci = { matches: true }; FERMO = parseFloat(q[1]); fermoFinale(); }
  window.ccVai = function (s) { FERMO = s; fermoFinale(); };
})();
