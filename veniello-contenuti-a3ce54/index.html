<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prova · Creazione Contenuti r3</title>
<style>
/* r3 (21/11): reel PRIMO nella griglia, niente altri post (quadrati grigi), niente barra di stato, icone in alto,
   numeri e pulsanti; telefono tutto nel riquadro; quasi tutto disegnato, profilo e reel diventano veri INSIEME alla fine.
   Il profilo disegnato lo costruisce lo script sulle misure di quello vero.
   Partenza: prototipo r2 (21/11): la scena di «Creazione Contenuti», tutta disegnata. Bicchiere e bottiglia a linee → la scritta →
   de-zoom sul profilo Instagram disegnato → il video vero (colori originali) nell'ultimo quadrato → il profilo vero del Jué.
   Animazioni: transform, opacity, clip-path, stroke-dashoffset (Web Animations API, un giro di 10 s che si ripete). */
@font-face{font-family:'Inter';src:url(fonts/inter.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'News';src:url(fonts/Newsreader-italic.woff2) format('woff2');font-weight:200 800;font-style:italic;font-display:swap}
:root{--bg:#100F09;--av:#F5F4EF;--av2:rgba(245,244,239,.62);--rec:#FF5A1F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--av)}
body{font:400 17px/1.55 'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:24px}
.colonna{width:100%;max-width:560px;margin:0 auto}

/* il riquadro dei Servizi (.m della home) */
.cc{position:relative;aspect-ratio:4/5;margin:0 -8px;border-radius:14px;overflow:hidden;isolation:isolate;container-type:inline-size;
  background:linear-gradient(180deg,#1A1912 0%,#13120C 60%);box-shadow:inset 0 0 0 1px rgba(245,244,239,.085);display:flex;flex-direction:column}
.cc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:9;box-shadow:inset 0 0 0 1px rgba(245,244,239,.09)}
.cc p{margin:0}

/* la frase in alto, come nel Sito Web */
.cc-testa{flex:none;padding:20px 20px 0;position:relative;z-index:2}
.cc-battute{display:grid}
.cc-battuta{grid-area:1/1;font-weight:560;font-size:clamp(22px,7.3cqi,30px);line-height:1.08;letter-spacing:-.036em;color:var(--av2)}
.cc-battuta em{font-style:normal;font-weight:600;color:var(--av);letter-spacing:-.03em}
.cc-battuta + .cc-battuta{opacity:0}
.cc-pt{display:inline-block;width:.19em;height:.19em;border-radius:50%;background:var(--rec);margin-left:.05em}

/* la scena: palco 340 × 360 adattato dallo script, appoggiato in basso */
.cc-scena{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.cc-palco{position:absolute;left:0;top:0;width:340px;height:360px;transform-origin:0 0}
.cc-giro{position:absolute;inset:0}
.cc-ab{position:absolute}

/* il tratto: crema sottile, accenti arancio; si disegna con stroke-dashoffset (pathLength = 1) */
.cc svg{display:block;overflow:visible}
.tr{fill:none;stroke:rgba(245,244,239,.82);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1.05}
.tr.fine{stroke:rgba(245,244,239,.36);stroke-width:.85}
.tr.ar{stroke:var(--rec)}
.tr.testo{stroke:rgba(245,244,239,.5);stroke-width:3}
.tr.testo.f{stroke-width:1.6;stroke:rgba(245,244,239,.3)}

/* il foglio del disegno (diventa l'ultimo quadrato della griglia) */
.cc-carta{left:85.625px;top:34px;width:168.75px;height:300px;transform-origin:50% 50%;clip-path:inset(0% 0% 0% 0% round 9px)}
.cc-carta-fondo{position:absolute;inset:0;background:#17160F;opacity:0}
.cc-carta svg{position:absolute;inset:0;width:100%;height:100%}
.cc-titolo{position:absolute;left:15px;right:10px;bottom:46px;font-weight:650;font-size:24px;line-height:1.02;letter-spacing:-.04em;color:var(--av);margin:0}
.cc-riga{display:block;overflow:hidden;padding:.06em 0 .1em;margin:-.06em 0 -.1em}
.cc-riga > span{display:inline-block}
.cc-c{display:inline-block;transform:translateY(110%)}
.cc-jue{font-family:'News',Georgia,serif;font-style:italic;font-weight:400;font-size:1.3em;letter-spacing:-.015em;line-height:.8}
.cc-dot{display:inline-block;width:.21em;height:.21em;border-radius:50%;background:var(--rec);margin-left:.03em;transform:scale(0)}
.cc-carta svg.cc-sotto{position:absolute;inset:auto;left:45px;top:251px;width:46px;height:9px}
/* il reel vero: stesso foglio, colori originali */
.cc-reel{left:85.625px;top:34px;width:168.75px;height:300px;transform-origin:50% 50%;clip-path:inset(12.5% 0% 12.5% 0% round 4px)}
.cc-reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cc-reel .cc-ombra{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55))}
.cc-reel .cc-titolo{color:#fff}
.cc-reel .cc-c,.cc-reel .cc-dot{transform:none}

/* la pagina Instagram disegnata (lo script la costruisce sulle misure del profilo vero) */
.cc-disegno{left:0;top:0;width:340px;height:360px}
.cc-disegno svg{position:absolute;left:0;top:0;width:340px;height:360px}
.cc-grigio{fill:#2A2922;opacity:0}

/* il profilo vero del Jué: tutto dentro il riquadro, centrato; si scopre con un cerchio che parte dal reel */
.cc-tel{left:82px;top:4px;width:176px;height:352px;border-radius:28px;background:#0A0906;
  box-shadow:inset 0 0 0 1px rgba(245,244,239,.16),0 0 0 4px #0D0C08,0 0 0 5px rgba(245,244,239,.07);clip-path:circle(0px at 50% 50%)}
.cc-schermo{position:absolute;inset:5px;border-radius:23px;overflow:hidden;background:#0B0A07;font-family:'Inter',sans-serif;color:var(--av);text-align:center}
.cc-isola{position:absolute;top:5px;left:50%;width:50px;height:13px;margin-left:-25px;border-radius:99px;background:#000}
.cc-barra{margin-top:26px;height:14px;display:flex;align-items:center;justify-content:center;gap:3px;font:700 8.5px/1 'Inter',sans-serif;letter-spacing:-.01em}
.cc-barra svg{width:8px;height:8px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cc-av{display:block;margin:12px auto 0;width:54px;height:54px;border-radius:50%;background:#000 url(media/jue-logo.png) 50% 54%/66% auto no-repeat;box-shadow:0 0 0 2px #0B0A07,0 0 0 3.5px var(--rec)}
.cc p.cc-nome{margin:10px 0 0;font:600 8px/1 'Inter',sans-serif}
.cc p.cc-bio{margin:5px 0 0;font-size:6.8px;line-height:1;color:var(--av2)}
.cc-nome span,.cc-bio span{display:inline-block}
.cc-schede{display:flex;margin-top:13px;border-bottom:1px solid rgba(245,244,239,.1)}
.cc-schede span{flex:1;height:22px;display:grid;place-content:center;color:rgba(245,244,239,.42)}
.cc-schede span:first-child{color:var(--av);box-shadow:inset 0 -1px 0 var(--av)}
.cc-schede svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cc-griglia{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:1px}
.cc-griglia > i{position:relative;display:block;aspect-ratio:3/4;background:#2A2922}
.cc-griglia > i:first-child{background:#0B0A07}
.cc-casa{position:absolute;left:50%;bottom:7px;width:54px;height:3px;margin-left:-27px;border-radius:2px;background:rgba(245,244,239,.55)}
/* il reel vero: il ritaglio 3:4 sta fuori, il cerchio che lo scopre dentro */
.cc-reel-in{position:absolute;inset:0;clip-path:circle(0px at 50% 50%)}
</style>
</head>
<body>
<main class="colonna">
  <div class="cc" id="cc" role="img" aria-label="Esempio: un bicchiere e una bottiglia disegnati a linee, la scritta «Aperitivo al Jué», poi la vista si allarga su un profilo Instagram disegnato; nell'ultimo quadrato parte il video vero e il disegno diventa il profilo vero del Jué Club.">
    <div class="cc-testa" aria-hidden="true">
      <div class="cc-battute">
        <p class="cc-battuta" id="cc-f1">Dall’idea<br> al <em>video</em><i class="cc-pt"></i></p>
        <p class="cc-battuta" id="cc-f2">Dritto sul tuo<br> <em>profilo</em><i class="cc-pt"></i></p>
      </div>
    </div>
    <div class="cc-scena" id="cc-scena" aria-hidden="true">
      <div class="cc-palco" id="cc-palco"><div class="cc-giro" id="cc-giro">

        <!-- 3 · il profilo disegnato: i tratti li crea lo script sulle misure del profilo vero -->
        <div class="cc-ab cc-disegno" id="cc-disegno"><svg viewBox="0 0 340 360"><g id="cc-d-griglia"></g><g id="cc-d-telg"></g><g id="cc-d-testa"></g></svg></div>

        <!-- 5 · il profilo vero: nome, foto, «Jué Club», la riga del locale, le schede e la griglia grigia; il primo quadrato è il reel -->
        <div class="cc-ab cc-tel" id="cc-tel"><div class="cc-schermo">
          <i class="cc-isola" id="cc-isola"></i>
          <div class="cc-barra"><span id="cc-m-nick">jueclubmontecatini</span><svg viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></svg></div>
          <i class="cc-av" id="cc-m-av"></i>
          <p class="cc-nome"><span id="cc-m-nome">Jué Club</span></p>
          <p class="cc-bio"><span id="cc-m-bio">Cocktail bar · Bistrot · DJ set · Montecatini</span></p>
          <div class="cc-schede" id="cc-m-schede">
            <span><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></span>
            <span><svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><path d="M2.5 8h19M8.5 2.5l3 5.5M14.5 2.5l3 5.5"/></svg></span>
            <span><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19c1-2.6 3-3.9 5.5-3.9s4.5 1.3 5.5 3.9"/></svg></span>
          </div>
          <div class="cc-griglia" id="cc-m-griglia"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <i class="cc-casa" id="cc-casa"></i>
        </div></div>

        <!-- 1-2 · il foglio: bicchiere e bottiglia a linee, poi la scritta -->
        <div class="cc-ab cc-carta" id="cc-carta">
          <i class="cc-carta-fondo" id="cc-carta-fondo"></i>
          <svg viewBox="0 0 168.75 300">
            <rect class="tr fine" id="cc-cornice" pathLength="1" x=".7" y=".7" width="167.35" height="298.6" rx="9" style="stroke:rgba(245,244,239,.42)"/>
            <path class="tr fine cc-suolo" pathLength="1" d="M18 197.5H152"/>
            <g class="cc-bic">
              <path class="tr" pathLength="1" d="M33.5 96.5C34.4 128 35.4 160 36.6 190.4Q56 194 75.4 190.2C76.6 160 77.6 128 78.5 96"/>
              <path class="tr" pathLength="1" d="M32.6 96.3Q55.8 90.4 79 95.7Q56 101.6 32.6 96.3"/>
              <path class="tr fine" pathLength="1" d="M37 146l19 18 19-18M37 164l19-18 19 18M38 181l18-16 18 16"/>
            </g>
            <g class="cc-ghi">
              <path class="tr" pathLength="1" d="M41 108l14-3.4 3.4 14-14 3.4z"/><path class="tr" pathLength="1" d="M58 114l13 2.6-2.6 13-13-2.6z"/><path class="tr" pathLength="1" d="M44 128l12.5-.8.8 12.5-12.5.8z"/>
              <path class="tr ar" pathLength="1" d="M70.5 93.5A12 12 0 0 1 93 86.8L70.5 93.5"/><path class="tr ar" pathLength="1" d="M75 91.6l3.4-5.6M80.8 89.9l1.4-6.4M86.2 88.3l-.8-6.2"/>
            </g>
            <g class="cc-bot">
              <path class="tr" pathLength="1" d="M112 60.5h14v-8h-14z"/>
              <path class="tr" pathLength="1" d="M113.5 60.5v14c0 4-12.5 7-12.5 14v100.5q0 3 3 3h30q3 0 3-3V88.5c0-7-12.5-10-12.5-14v-14"/>
              <path class="tr ar" pathLength="1" d="M106 128h26v38h-26z"/>
              <path class="tr fine" pathLength="1" d="M111 138h16M113 146h12M110 156h18"/>
              <path class="tr fine" pathLength="1" d="M131 96v24M131 174v12"/>
            </g>
          </svg>
          <p class="cc-titolo" id="cc-titolo"><span class="cc-riga"><span data-s>Aperitivo</span></span><span class="cc-riga"><span data-s>al </span><span class="cc-jue" data-s>Jué</span><i class="cc-dot" id="cc-dot"></i></span></p>
          <svg class="cc-sotto" viewBox="0 0 52 10" preserveAspectRatio="none"><path class="tr ar" id="cc-sotto" pathLength="1" d="M1 7C14 3.4 30 2.6 51 4.6" style="stroke-width:1.6"/></svg>
        </div>

        <!-- 4 · il video vero, con i suoi colori -->
        <div class="cc-ab cc-reel" id="cc-reel"><div class="cc-reel-in" id="cc-reel-in">
          <video id="cc-video" muted playsinline preload="none" poster="media/reel.jpg" data-src="media/reel.mp4"></video>
          <i class="cc-ombra"></i>
          <p class="cc-titolo"><span class="cc-riga"><span class="cc-c">Aperitivo</span></span><span class="cc-riga"><span class="cc-c">al <span class="cc-jue">Jué</span></span><i class="cc-dot"></i></span></p>
        </div></div>
      </div></div>
    </div>
  </div>
</main>
<script>
(function () {
  'use strict';
  var L = 10, FERMO = 9.4, PLAY = 7.25;
  var $ = function (id) { return document.getElementById(id); };
  var cc = $('cc'), scena = $('cc-scena'), palco = $('cc-palco'), video = $('cc-video');
  if (!cc.animate) return;

  function adatta() {
    var w = scena.clientWidth, h = scena.clientHeight, k = Math.min(w / 340, h / 360);
    palco.style.transform = 'translate(' + ((w - 340 * k) / 2).toFixed(2) + 'px,' + (h - 360 * k).toFixed(2) + 'px) scale(' + k.toFixed(4) + ')';
  }
  adatta();
  if (window.ResizeObserver) new ResizeObserver(adatta).observe(scena); else addEventListener('resize', adatta);

  var FUORI = 'cubic-bezier(.22,.61,.36,1)', MORBIDA = 'cubic-bezier(.65,0,.35,1)', TRATTO = 'cubic-bezier(.45,.05,.25,1)',
      TIPO = 'cubic-bezier(.16,1,.3,1)', POP = 'cubic-bezier(.34,1.5,.64,1)';
  var giri = [];
  function T(el, prop, tappe) {
    if (typeof el === 'string') el = $(el);
    var kf = [], i, s;
    if (tappe[0][0] > 0) { s = {}; s[prop] = tappe[0][1]; s.offset = 0; kf.push(s); }
    for (i = 0; i < tappe.length; i++) { s = {}; s[prop] = tappe[i][1]; s.offset = Math.min(1, tappe[i][0] / L); s.easing = tappe[i][2] || 'linear'; kf.push(s); }
    if (tappe[tappe.length - 1][0] < L) { s = {}; s[prop] = tappe[tappe.length - 1][1]; s.offset = 1; kf.push(s); }
    var a = el.animate(kf, { duration: L * 1000, iterations: Infinity, fill: 'both' });
    a.pause(); giri.push(a); return a;
  }
  // disegna un tratto (o tutti i tratti dentro un gruppo, uno dopo l'altro)
  function disegna(el, t0, dur, passo) {
    if (typeof el === 'string') el = document.querySelector(el);
    var tr = el.classList && el.classList.contains('tr') ? [el] : Array.prototype.slice.call(el.querySelectorAll('.tr'));
    tr.forEach(function (p, i) { var a = t0 + i * (passo || 0); T(p, 'strokeDashoffset', [[a, 1.05, TRATTO], [a + dur, 0]]); T(p, 'opacity', [[a, 0], [a + .02, 1]]); });
  }

  // ── 0 · il giro entra e alla fine sfuma ──
  T('cc-giro', 'opacity', [[0, 0, FUORI], [.2, 1], [9.6, 1, MORBIDA], [9.97, 0]]);
  T('cc-f1', 'opacity', [[3.7, 1, FUORI], [4.0, 0], [9.6, 0, FUORI], [9.95, 1]]);
  T('cc-f1', 'transform', [[3.7, 'translateY(0px)', FUORI], [4.05, 'translateY(-8px)'], [9.55, 'translateY(10px)', FUORI], [9.95, 'translateY(0px)']]);
  T('cc-f2', 'opacity', [[3.85, 0, FUORI], [4.25, 1], [9.45, 1, FUORI], [9.75, 0]]);
  T('cc-f2', 'transform', [[3.85, 'translateY(10px)', FUORI], [4.35, 'translateY(0px)'], [9.45, 'translateY(0px)', FUORI], [9.8, 'translateY(-8px)']]);

  // ── 1 · bicchiere e bottiglia si disegnano (0,2 – 1,9 s) ──
  disegna('#cc-cornice', .15, .7);
  disegna('.cc-bic', .45, .6, .12);
  disegna('.cc-bot', .7, .6, .1);
  disegna('.cc-suolo', 1.1, .5);
  disegna('.cc-ghi', 1.05, .4, .07);

  // ── 2 · la scritta: lettere che salgono, «Jué» in corsivo, la sottolineatura arancio e il punto (2,0 – 3,3 s) ──
  var n = 0;
  Array.prototype.forEach.call(document.querySelectorAll('#cc-titolo [data-s]'), function (sp) {
    var testo = sp.textContent; sp.textContent = '';
    testo.split('').forEach(function (ch) {
      var c = document.createElement('span'); c.className = 'cc-c'; c.textContent = ch === ' ' ? ' ' : ch; sp.appendChild(c);
      var a = 2.0 + n * .04 + (sp.classList.contains('cc-jue') ? .12 : 0); n++;
      T(c, 'transform', [[a, 'translateY(130%)', TIPO], [a + .65, 'translateY(0%)']]); T(c, 'opacity', [[a, 0], [a + .12, 1]]);
    });
  });
  disegna('#cc-sotto', 2.85, .45);
  T('cc-dot', 'transform', [[3.05, 'scale(0)', POP], [3.35, 'scale(1)']]);

  // ── 3 · de-zoom: il foglio diventa il PRIMO quadrato, il profilo si disegna intorno (3,7 – 6,0 s) ──
  // misure nel palco (offset: non risentono delle trasformazioni)
  function M(el) { if (typeof el === 'string') el = $(el); var x = 0, y = 0, e = el; while (e && e !== palco) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight }; }
  var NS = 'http://www.w3.org/2000/svg';
  function tratto(g, tag, att, cls) {
    var e = document.createElementNS(NS, tag), k; for (k in att) e.setAttribute(k, att[k]);
    e.setAttribute('class', cls); if (/\btr\b/.test(cls)) e.setAttribute('pathLength', '1'); g.appendChild(e); return e;
  }
  function riga(g, r, cls) { return tratto(g, 'path', { d: 'M' + r.x + ' ' + (r.y + r.h / 2) + 'H' + (r.x + r.w) }, cls); }
  var gG = $('cc-d-griglia'), gT = $('cc-d-telg'), gH = $('cc-d-testa'), r;
  var tel = M('cc-tel'); tratto(gT, 'rect', { x: tel.x, y: tel.y, width: tel.w, height: tel.h, rx: 28 }, 'tr');
  r = M('cc-isola'); tratto(gH, 'rect', { x: r.x, y: r.y, width: r.w, height: r.h, rx: r.h / 2 }, 'tr fine');
  r = M('cc-m-nick'); riga(gH, { x: r.x + 1, y: r.y, w: r.w - 2, h: r.h }, 'tr testo');
  tratto(gH, 'path', { d: 'M' + (r.x + r.w + 4) + ' ' + (r.y + r.h / 2 - 1.5) + 'l2.5 2.5l2.5-2.5' }, 'tr fine');
  r = M('cc-m-av'); var acx = r.x + r.w / 2, acy = r.y + r.h / 2, ruota = 'rotate(-90 ' + acx + ' ' + acy + ')';
  tratto(gH, 'circle', { cx: acx, cy: acy, r: r.w / 2 + 3, transform: ruota }, 'tr ar');
  tratto(gH, 'circle', { cx: acx, cy: acy, r: r.w / 2 - 1, transform: ruota }, 'tr fine');
  riga(gH, M('cc-m-nome'), 'tr testo');
  riga(gH, M('cc-m-bio'), 'tr testo f');
  Array.prototype.forEach.call($('cc-m-schede').children, function (sp, k) {
    var q = M(sp), cx = q.x + q.w / 2, cy = q.y + q.h / 2;
    tratto(gH, 'rect', { x: cx - 4.5, y: cy - 4.5, width: 9, height: 9, rx: k ? 2.5 : 1.5 }, 'tr fine');
  });
  r = M('cc-m-schede'); var c0 = M($('cc-m-schede').children[0]);
  tratto(gH, 'path', { d: 'M' + r.x + ' ' + (r.y + r.h - .5) + 'H' + (c0.x + c0.w) }, 'tr');
  tratto(gH, 'path', { d: 'M' + (c0.x + c0.w) + ' ' + (r.y + r.h) + 'H' + (r.x + r.w) }, 'tr fine');
  var celle = Array.prototype.map.call($('cc-m-griglia').children, M);
  celle.forEach(function (q, k) { if (k) tratto(gG, 'rect', { x: q.x, y: q.y, width: q.w, height: q.h }, 'cc-grigio'); });
